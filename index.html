<div id="noise-overlay"></div>

<!-- SCREEN 1 — SEAL / ACCESS GATE -->
<div id="seal-screen">
  <div class="seal-glow"></div>

  <div class="seal-wrap">

  </div>

<!-- SCREEN 2 — BOOT LOG -->
<div id="boot-screen" class="crt">

</div>

<!-- SCREEN 3 — DESKTOP -->
<div id="desktop" class="crt">
  <div class="watermark" id="desktop-watermark">admiralOS</div>

  </div>

  <div class="icon-grid" id="icon-grid"></div>
  <div id="notes-layer"></div>
  <div id="windows-layer"></div>
  <div id="toast-layer"></div>
  <div id="finale-flash"></div>

  <div id="taskbar">
    <div id="start-btn"><span class="start-glyph">◆</span><span id="start-label">START</span></div>
    <div id="taskbar-apps"></div>
    <div id="status-cluster">
      <span id="conn-status">SECURE LINK: ACTIVE</span>
      <span id="clock">10:06 PM</span>
    </div>
  </div>
